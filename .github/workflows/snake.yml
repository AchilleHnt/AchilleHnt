name: Generate Snake Animation

on:
  # S'exécute automatiquement tous les jours à minuit
  schedule:
    - cron: "0 0 * * *"
  
  # Permet de lancer manuellement l'action depuis l'onglet Actions sur GitHub
  workflow_dispatch:
  
  # S'exécute à chaque fois que tu fais un push sur la branche principale
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Génère les fichiers SVG du jeu du serpent
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pousse les SVG générés sur une branche dédiée nommée "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
